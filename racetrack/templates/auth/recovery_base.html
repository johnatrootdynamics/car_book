{% extends "base.html" %}
{% block body_class %}auth-login auth-login-unified{% endblock %}
{% block page_styles %}<link rel="stylesheet" href="{{ url_for('static', filename='login.css', v='20261117-reset') }}">{% endblock %}
{% block content %}
<section class="login-shell" aria-labelledby="recovery-title">
  <a class="login-brand" href="{{ url_for('auth.home') }}" aria-label="Track Ops home">
    {% include "shared/brand_logo.html" %}
  </a>
  <div class="login-card">
    {% block recovery_content %}{% endblock %}
    <p class="login-account-prompt"><a href="{{ url_for('auth.user_login') }}">Back to sign in</a></p>
  </div>
</section>
{% endblock %}
