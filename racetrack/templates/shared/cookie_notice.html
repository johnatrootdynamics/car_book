<section class="cookie-notice" data-cookie-notice hidden tabindex="-1" aria-labelledby="cookie-notice-title" aria-describedby="cookie-notice-description">
  <div class="cookie-notice-copy">
    <h2 id="cookie-notice-title">Only essential cookies.</h2>
    <p id="cookie-notice-description">Track Ops uses cookies for sign-in, your cart and form security. We don’t use analytics or advertising cookies.</p>
    <p class="cookie-notice-storage">Dismissing this notice saves a preference in this tab until you close it.</p>
  </div>
  <div class="cookie-notice-actions">
    <a href="{{ url_for('auth.cookies') }}">Cookie details</a>
    <button type="button" data-cookie-dismiss>Got it</button>
  </div>
</section>
