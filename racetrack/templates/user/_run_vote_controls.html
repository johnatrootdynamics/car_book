<div class="audience-run-rating" data-run-id="{{ rating_run.id }}" aria-live="polite">
  <span class="audience-rating-label">Audience</span>
  <div class="audience-score">
    <span class="up"><i class="bi bi-hand-thumbs-up-fill"></i> {{ score.up or 0 }}</span>
    <span class="down"><i class="bi bi-hand-thumbs-down-fill"></i> {{ score.down or 0 }}</span>
  </div>
  {% if event.run_voting_enabled %}
    {% if score.mine %}
      <span class="audience-voted"><i class="bi bi-check-circle-fill"></i> You voted {{ 'up' if score.mine == 1 else 'down' }}</span>
    {% else %}
      <form method="post" action="{{ url_for('user.attendee_run_vote', event_id=event.id, run_id=rating_run.id) }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button name="vote" value="1" class="vote-up" aria-label="Thumbs up this run"><i class="bi bi-hand-thumbs-up"></i></button>
        <button name="vote" value="-1" class="vote-down" aria-label="Thumbs down this run"><i class="bi bi-hand-thumbs-down"></i></button>
      </form>
    {% endif %}
  {% else %}
    <span class="audience-voted muted"><i class="bi bi-lock-fill"></i> Voting off</span>
  {% endif %}
</div>
