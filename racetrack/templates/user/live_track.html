{% extends "base.html" %}
{% block content %}
<div class="audience-live-page"
     data-live-state-url="{{ url_for('user.attendee_live_state', event_id=event.id) }}"
     data-current-version="{{ current_version }}"
     data-history-version="{{ history_version }}">
  <header class="audience-live-hero">
    <h1>{{ event.event_name }}</h1>
  </header>

  <section class="audience-current-section" data-live-current aria-live="polite">{% include 'user/_live_current_section.html' %}</section>
  <section class="audience-history-section" data-live-history>{% include 'user/_live_history_section.html' %}</section>
</div>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const root = document.querySelector('[data-live-state-url]')
  if (!root) return
  const currentRegion = root.querySelector('[data-live-current]')
  const historyRegion = root.querySelector('[data-live-history]')
  let currentVersion = root.dataset.currentVersion || ''
  let historyVersion = root.dataset.historyVersion || ''

  const check = async () => {
    try {
      const url = new URL(root.dataset.liveStateUrl, window.location.origin)
      url.searchParams.set('current', currentVersion)
      url.searchParams.set('history', historyVersion)
      const response = await fetch(url, {
        headers: { 'Accept': 'application/json' },
        cache: 'no-store',
      })
      if (!response.ok) return
      const data = await response.json()
      if (typeof data.current_html === 'string' && currentRegion) currentRegion.innerHTML = data.current_html
      if (typeof data.history_html === 'string' && historyRegion) historyRegion.innerHTML = data.history_html
      currentVersion = data.current_version || currentVersion
      historyVersion = data.history_version || historyVersion
    } catch (error) {
    } finally {
      window.setTimeout(check, 2000)
    }
  }
  check()
})
</script>
{% endblock %}
