{% extends "base.html" %}
{% block content %}
<header class="page-header"><div><span class="event-page-kicker">Live operations</span><h2>Cars on track</h2><p>Testing mode: cars clear automatically 20 seconds after their latest entrance read.</p></div><div class="track-live-count"><strong id="track-count">0</strong><span>on track</span></div></header>
<section class="card"><div id="track-live-grid" class="track-live-grid"><p class="muted-line">Loading live track status…</p></div></section>
<section class="card previous-runs-card">
  <div class="employee-dashboard-section-head"><div><span>History</span><h3>Previous runs</h3></div></div>
  <div id="previous-runs"><p class="muted-line">Loading completed runs…</p></div>
</section>
{% endblock %}
{% block scripts %}<script>
const grid=document.getElementById('track-live-grid'),count=document.getElementById('track-count'),runsEl=document.getElementById('previous-runs');let lastTrackSignature=null,lastRunsSignature=null;function esc(v){const d=document.createElement('div');d.textContent=v??'—';return d.innerHTML}
function photo(value,alt,fallback,kind){return `<div class="track-live-photo ${kind}">${value?`<img src="${esc(value)}" alt="${esc(alt)}">`:fallback}</div>`}
async function refreshTrack(){try{const r=await fetch('{{ url_for("employee.live_track_data") }}');const d=await r.json();count.textContent=d.count;const signature=JSON.stringify(d.cars.map(x=>x.car_id));if(signature!==lastTrackSignature){lastTrackSignature=signature;grid.innerHTML=d.cars.length?d.cars.map(x=>`<article class="track-live-car">${photo(x.driver_image,x.driver,`<span>${esc(x.driver_initials)}</span>`,'driver-photo')}<div class="track-live-identity"><span class="track-live-dot"></span><strong>${esc(x.driver)}</strong><p>${esc(x.car)}${x.color?' · '+esc(x.color):''}</p><small>Last read ${esc(new Date(x.entered_at).toLocaleTimeString())} via ${esc(x.scanner)}</small></div>${photo(x.car_image,x.car,'<i class="bi bi-car-front-fill" aria-hidden="true"></i>','car-photo')}</article>`).join(''):'<div class="employee-dashboard-empty"><i class="bi bi-flag"></i><div><strong>Track is clear</strong><p>No activated cars have entered.</p></div></div>'}const runsSignature=JSON.stringify(d.runs.map(x=>x.id));if(runsSignature!==lastRunsSignature){lastRunsSignature=runsSignature;runsEl.innerHTML=d.runs.length?d.runs.map((run,index)=>`<article class="previous-run"><header><div><strong>Run #${esc(run.id)}</strong><span>${esc(new Date(run.started_at).toLocaleTimeString())} – ${esc(new Date(run.ended_at).toLocaleTimeString())}</span></div><span>${run.participants.length} driver${run.participants.length===1?'':'s'}</span></header><div class="previous-run-drivers">${run.participants.map(x=>`<div class="previous-run-driver">${photo(x.driver_image,x.driver,`<span>${esc(x.driver_initials)}</span>`,'driver-photo')}<div><strong>${esc(x.driver)}</strong><span>${esc(x.car)}</span></div>${photo(x.car_image,x.car,'<i class="bi bi-car-front-fill" aria-hidden="true"></i>','car-photo')}</div>`).join('')}</div></article>`).join(''):'<p class="muted-line">Completed runs will appear here.</p>'}}catch(e){grid.innerHTML='<p class="muted-line">Unable to refresh track status.</p>';lastTrackSignature=null}}
refreshTrack();setInterval(refreshTrack,2000);
</script>{% endblock %}
